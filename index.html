<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roguemap">
<title>Roguemap // Explorer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--cyan:#00ffff;--pink:#ff00ff;--board:min(94vw,540px,72vh)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{background:#000;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;min-height:100vh;min-height:100dvh;overflow:hidden;touch-action:none;display:flex;justify-content:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#gameWrapper{width:min(100%,560px);height:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
#headerZone{text-align:center;flex:0 0 auto}
h1{font-size:clamp(1.5rem,7vw,2.4rem);color:var(--cyan);text-shadow:0 0 15px var(--cyan);letter-spacing:4px;text-transform:uppercase}
#subText{font-size:.82rem;color:var(--pink);text-shadow:0 0 8px var(--pink)}
#stats{width:var(--board);display:flex;justify-content:space-between;font:700 .78rem monospace;color:#aaa;gap:8px}
#best{color:#ffd54f}
#boardContainer{position:relative;width:var(--board);height:var(--board);background:#050505;border:3px solid #111;border-radius:9px;overflow:hidden;box-shadow:0 0 30px rgba(0,255,255,.07)}
#grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);width:100%;height:100%}
.cell{display:flex;align-items:center;justify-content:center;font-size:clamp(.72rem,3.8vw,1.35rem);font-weight:900;user-select:none;border:1px solid rgba(255,255,255,.035);transition:background-color .12s,transform .08s}
.cell.covered:active{transform:scale(.9);filter:brightness(1.35)}
.forest{background:radial-gradient(circle,#0e3a1d 20%,#06220f 80%)}
.grassland{background:radial-gradient(circle,#1b4d22 20%,#0f2e15 80%)}
.land{background:radial-gradient(circle,#444 20%,#222 80%)}
.sea{background:radial-gradient(circle,#0b2d4f 20%,#041628 80%)}
.cell.revealed{background:#020202!important;border-color:#111}.cell.flagged{color:#ff43ff;text-shadow:0 0 8px #ff00ff}
.n-1{color:#0ff;text-shadow:0 0 8px #0ff}.n-2{color:#0f0;text-shadow:0 0 8px #0f0}.n-3{color:#fa0;text-shadow:0 0 8px #fa0}.n-4,.n-5,.n-6,.n-7,.n-8{color:#ff245e;text-shadow:0 0 9px #ff245e}
.enemy{animation:pop .24s ease-out}@keyframes pop{from{transform:scale(.45);opacity:.2}to{transform:scale(1);opacity:1}}
.overlay{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.hide{display:none!important}
.overlay h2{font-size:1.8rem;color:var(--cyan);margin-bottom:6px}.overlay p{color:#888;font-size:.9rem;margin-bottom:14px;line-height:1.45}
#difficultyZone{display:flex;gap:7px;margin-bottom:4px}.diff-opt,.action,.ctl{background:#050505;color:#777;border:1px solid #333;border-radius:7px;padding:8px 12px;font-weight:800;cursor:pointer}
.diff-opt.selected{color:var(--pink);border-color:var(--pink);box-shadow:0 0 10px rgba(255,0,255,.25)}
.action{color:var(--cyan);border:2px solid var(--cyan);padding:11px 24px;margin-top:10px}
#controlPanel{width:var(--board);display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px;font:700 .76rem monospace;color:var(--cyan)}
.ctl{color:#bbb;padding:8px 10px}.ctl.active{color:var(--pink);border-color:var(--pink);box-shadow:0 0 9px rgba(255,0,255,.2)}
#hint{font-size:.68rem;color:#555;text-align:center;min-height:14px}
@media(max-height:680px){:root{--board:min(88vw,500px,66vh)}h1{font-size:1.35rem}#subText{display:none}}
@media(prefers-reduced-motion:reduce){.cell,.enemy{transition:none;animation:none}}
</style>
</head>
<body>
<div id="gameWrapper">
 <div id="headerZone"><h1>Roguemap</h1><div id="subText">Explorer</div></div>
 <div id="stats"><span id="timer">00:00</span><span id="remaining">TRAPS: 16</span><span id="best">BEST: --:--</span></div>
 <div id="boardContainer">
  <div id="uiOverlay" class="overlay">
   <h2 id="overlayTitle">Radar On</h2>
   <p id="overlayDesc">Dig the map. Flag danger. First dig is safe.</p>
   <div id="difficultyZone">
    <button class="diff-opt" data-traps="10" data-name="easy">Easy</button>
    <button class="diff-opt selected" data-traps="16" data-name="medium">Medium</button>
    <button class="diff-opt" data-traps="22" data-name="hard">Hard</button>
   </div>
   <button id="startBtn" class="action">Generate Map</button>
  </div>
  <div id="pauseOverlay" class="overlay hide"><h2>Paused</h2><button id="resumeBtn" class="action">Resume</button></div>
  <div id="grid"></div>
 </div>
 <div id="controlPanel">
  <span id="flagDisplay">FLAGS: 0 / 16</span>
  <button id="modeToggleBtn" class="ctl">DIG</button>
  <button id="pauseBtn" class="ctl">PAUSE</button>
 </div>
 <div id="hint">Tap to dig · long-press to flag · tap a revealed number to chord</div>
</div>
<script>
const SIZE=12,grid=document.getElementById('grid'),ui=document.getElementById('uiOverlay'),pauseOverlay=document.getElementById('pauseOverlay');
const timerEl=document.getElementById('timer'),remainingEl=document.getElementById('remaining'),flagDisplay=document.getElementById('flagDisplay'),bestEl=document.getElementById('best');
const overlayTitle=document.getElementById('overlayTitle'),overlayDesc=document.getElementById('overlayDesc'),startBtn=document.getElementById('startBtn'),modeBtn=document.getElementById('modeToggleBtn'),pauseBtn=document.getElementById('pauseBtn');
const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx=null;
function sfx(f,t='triangle',d=.08,v=.05){try{if(!audioCtx)audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
const ASSETS={vortex:'🌪️',shark:'🦈',snake:'🐍',scorpion:'🦂',ant:'🐜',spider:'🕷️',web:'🕸️'},BIOMES=['forest','grassland','land','sea'];
let board=[],traps=16,difficulty='medium',active=false,flagMode=false,flags=0,firstDig=true,seconds=0,timer=null,paused=false,longTimer=null,longTriggered=false;

document.querySelectorAll('.diff-opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.diff-opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');traps=+b.dataset.traps;difficulty=b.dataset.name;updateHud()});
function makeBoard(){board=Array.from({length:SIZE*SIZE},()=>({trap:false,revealed:false,flagged:false,count:0,biome:BIOMES[Math.floor(Math.random()*4)],enemy:null}))}
function neighbors(i){const r=Math.floor(i/SIZE),c=i%SIZE,out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE)out.push(rr*SIZE+cc)}return out}
function placeTraps(safeIdx){
 const safe=new Set([safeIdx,...neighbors(safeIdx)]),spots=[...Array(SIZE*SIZE).keys()].filter(i=>!safe.has(i));
 for(let n=0;n<traps;n++){const k=Math.floor(Math.random()*spots.length),i=spots.splice(k,1)[0];board[i].trap=true;board[i].enemy=Object.keys(ASSETS)[Math.floor(Math.random()*7)]}
 board.forEach((c,i)=>c.count=c.trap?0:neighbors(i).filter(n=>board[n].trap).length);
}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(active&&!paused){seconds++;timerEl.textContent=fmt(seconds)}},1000)}
function updateBest(){const k=`roguemap-best-${difficulty}`,v=+localStorage.getItem(k)||0;if(!v||seconds<v)localStorage.setItem(k,seconds);showBest()}
function showBest(){const v=+localStorage.getItem(`roguemap-best-${difficulty}`)||0;bestEl.textContent=`BEST: ${v?fmt(v):'--:--'}`}
function updateHud(){remainingEl.textContent=`TRAPS: ${Math.max(0,traps-flags)}`;flagDisplay.textContent=`FLAGS: ${flags} / ${traps}`;modeBtn.textContent=flagMode?'FLAG':'DIG';modeBtn.classList.toggle('active',flagMode);showBest()}
function startGame(){makeBoard();active=true;flagMode=false;flags=0;firstDig=true;seconds=0;paused=false;timerEl.textContent='00:00';ui.classList.add('hide');pauseOverlay.classList.add('hide');updateHud();render();startTimer();sfx(460)}
function toggleFlag(i){
 const c=board[i];if(!active||c.revealed)return;
 if(!c.flagged&&flags>=traps)return;
 c.flagged=!c.flagged;flags+=c.flagged?1:-1;sfx(c.flagged?220:160);updateHud();render();checkWin()
}
function flood(start){
 const q=[start],seen=new Set();
 while(q.length){const i=q.shift();if(seen.has(i))continue;seen.add(i);const c=board[i];if(c.flagged||c.trap||c.revealed)continue;c.revealed=true;if(c.count===0)neighbors(i).forEach(n=>{if(!seen.has(n)&&!board[n].trap&&!board[n].flagged)q.push(n)})}
}
function lose(i){active=false;clearInterval(timer);board.forEach(c=>{if(c.trap)c.revealed=true});render();sfx(75,'sawtooth',.55,.15);overlayTitle.textContent='Expedition Lost';overlayDesc.textContent=`You uncovered a ${board[i].enemy}. Time ${fmt(seconds)}.`;startBtn.textContent='Generate Map';ui.classList.remove('hide')}
function reveal(i){
 if(!active||paused)return;const c=board[i];
 if(c.revealed){if(c.count>0)chord(i);return}
 if(c.flagged)return;
 if(firstDig){placeTraps(i);firstDig=false}
 if(c.trap){c.revealed=true;lose(i);return}
 flood(i);sfx(90,'triangle',.07,.04);render();checkWin()
}
function chord(i){
 const c=board[i],ns=neighbors(i),marked=ns.filter(n=>board[n].flagged).length;if(marked!==c.count)return;
 for(const n of ns){const x=board[n];if(!x.flagged&&!x.revealed){if(x.trap){lose(n);return}else flood(n)}}sfx(130);render();checkWin()
}
function checkWin(){if(!active)return;const safe=board.filter(c=>!c.trap);if(safe.every(c=>c.revealed)){active=false;clearInterval(timer);updateBest();sfx(780,'sine',.3,.1);overlayTitle.textContent='Map Cleared';overlayDesc.textContent=`${difficulty.toUpperCase()} · ${fmt(seconds)} · Best ${bestEl.textContent.replace('BEST: ','')}`;startBtn.textContent='Explore Again';ui.classList.remove('hide')}}
function render(){
 grid.innerHTML='';board.forEach((c,i)=>{const d=document.createElement('div');d.className='cell '+c.biome;
 if(c.revealed){d.classList.add('revealed');if(c.trap){d.classList.add('enemy');d.textContent=ASSETS[c.enemy]}else if(c.count){d.textContent=c.count;d.classList.add('n-'+c.count)}}
 else{d.classList.add('covered');if(c.flagged){d.textContent='⚑';d.classList.add('flagged')}}
 d.oncontextmenu=e=>{e.preventDefault();toggleFlag(i)};
 d.onpointerdown=e=>{if(e.pointerType==='touch'){longTriggered=false;longTimer=setTimeout(()=>{longTriggered=true;toggleFlag(i)},430)}};
 d.onpointerup=e=>{clearTimeout(longTimer);if(e.pointerType==='touch'&&longTriggered)return;if(flagMode)toggleFlag(i);else reveal(i)};
 d.onpointercancel=()=>clearTimeout(longTimer);d.onpointerleave=e=>{if(e.pointerType==='touch')clearTimeout(longTimer)};
 grid.appendChild(d)})}
function setPause(v){if(!active)return;paused=v;pauseOverlay.classList.toggle('hide',!v);pauseBtn.textContent=v?'RESUME':'PAUSE'}
modeBtn.onclick=()=>{if(active){flagMode=!flagMode;updateHud()}};
pauseBtn.onclick=()=>setPause(!paused);document.getElementById('resumeBtn').onclick=()=>setPause(false);startBtn.onclick=startGame;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)setPause(true)});
showBest();updateHud();makeBoard();render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
</body>
</html>
